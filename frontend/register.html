<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Dashboard Builder</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/base.css">
</head>
<body class="auth-page">
<div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

<main class="auth-card">
  <div class="auth-card__brand">
    <img src="/favicon.svg" alt="" width="40" height="40">
    <h1>Create your account</h1>
    <p class="muted">Start building dashboards in seconds.</p>
  </div>

  <form id="register-form" class="form" novalidate>
    <div class="alert alert--error" data-form-error hidden></div>

    <div class="field">
      <label for="name">Full name <span class="required" aria-hidden="true">*</span></label>
      <input id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="50" autofocus>
      <p class="field__error" data-error-for="name"></p>
    </div>

    <div class="field">
      <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
      <p class="field__error" data-error-for="email"></p>
    </div>

    <div class="field">
      <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"
             aria-describedby="password-hint">
      <p id="password-hint" class="field__hint">At least 8 characters with an uppercase letter, a lowercase letter and a number.</p>
      <p class="field__error" data-error-for="password"></p>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm password <span class="required" aria-hidden="true">*</span></label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required maxlength="72">
      <p class="field__error" data-error-for="confirmPassword"></p>
    </div>

    <button type="submit" class="btn btn--primary btn--block">Create account</button>
  </form>

  <p class="auth-card__footer">Already have an account? <a href="/login">Sign in</a></p>
</main>

<script type="module" src="/src/pages/register.page.js"></script>
</body>
</html>
