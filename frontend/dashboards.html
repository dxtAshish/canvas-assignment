<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My dashboards · Dashboard Builder</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/dashboards.css">
</head>
<body class="list-page">
<div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

<header class="navbar">
  <a class="brand" href="/dashboards">
    <img src="/favicon.svg" alt="" width="28" height="28">
    <span>Dashboard Builder</span>
  </a>
  <div class="navbar__user" data-navbar-user hidden>
    <span class="navbar__name" data-user-name></span>
    <button type="button" class="btn btn--ghost btn--sm" data-action="logout">Sign out</button>
  </div>
</header>

<main class="container">
  <div class="page-header">
    <div>
      <h1>My dashboards</h1>
      <p class="muted">Create a dashboard, then drag sections, text, images and charts onto the canvas. Drag the cards to reorder them.</p>
    </div>
    <button type="button" class="btn btn--primary" data-action="new-dashboard">+ New dashboard</button>
  </div>

  <section id="dashboard-list" class="dashboard-grid" aria-busy="true" aria-label="Dashboards">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </section>
</main>

<dialog id="dashboard-dialog" class="modal" aria-labelledby="dashboard-dialog-title">
  <form id="dashboard-form" class="form" novalidate>
    <h2 id="dashboard-dialog-title" class="modal__title">New dashboard</h2>
    <div class="alert alert--error" data-form-error hidden></div>

    <div class="field">
      <label for="dashboard-name">Name</label>
      <input id="dashboard-name" name="name" type="text" required maxlength="100" placeholder="e.g. Sales overview">
      <p class="field__error" data-error-for="name"></p>
    </div>

    <div class="field">
      <label for="dashboard-description">Description <span class="muted">(optional)</span></label>
      <textarea id="dashboard-description" name="description" rows="3" maxlength="500"></textarea>
      <p class="field__error" data-error-for="description"></p>
    </div>

    <div class="field" data-create-only>
      <label for="dashboard-width">Canvas width</label>
      <select id="dashboard-width" name="canvasWidth">
        <option value="960">960 px (compact)</option>
        <option value="1200" selected>1200 px (standard)</option>
        <option value="1440">1440 px (wide)</option>
      </select>
      <p class="field__error" data-error-for="canvasWidth"></p>
    </div>

    <div class="modal__actions">
      <button type="button" class="btn btn--ghost" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn btn--primary">Create</button>
    </div>
  </form>
</dialog>

<script type="module" src="/src/pages/dashboards.page.js"></script>
</body>
</html>
